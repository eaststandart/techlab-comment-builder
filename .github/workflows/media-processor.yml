# ==============================================================================
# @module  media-processor.yml
# @about   Модуль автоматизации обработки и отправки медиа-пакетов.
# @purpose Защита от параллельного запуска процессов и вызов диспетчера медиа-пакетов.
# @author  TechLab
# @version 1.0.0
# ==============================================================================

name: TechLab Media Content Processor

on:
  push:
    paths:
      - '_input/**.md'

permissions:
  contents: write

# Защищаем репозиторий от одновременной работы нескольких диспетчеров.
# Текущий запущенный сервер последовательно обработает все прилетевшие комплекты.
concurrency:
  group: media-dispatcher
  cancel-in-progress: false

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Media Repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install pyyaml requests pillow

      - name: Run Smart Media Bundle Dispatcher
        env:
          MY_FINE_TOKEN: ${{ secrets.MY_FINE_TOKEN }}
        run: python _actions/media_dispatcher.py
